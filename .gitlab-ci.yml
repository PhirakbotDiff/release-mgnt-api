stages:
  - build
  - deploy

# Only run pipeline for version tags
workflow:
  rules:
    - if: $CI_COMMIT_TAG

variables:
  IMAGE_TAG: $CI_COMMIT_TAG
  REG_PWD: $REGISTRY_PWD
  REG_HOST: $REGISTRY_HOST
  REG_USERNAME: $REGISTRY_USERNAME

# DOCKER_HOST: unix:///var/run/docker.sock
# Build Docker image
build:
  stage: build
  image: docker:latest
  services:
    - name: docker:dind
      command: ["--tls=false", "--insecure-registry=10.20.10.117:5000"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: ""
    IMAGE_NAME: "$REG_HOST/$BE_IMAGE_NAME"
  before_script:
    - docker version
    - docker info
    - echo "Logging into private registry..."
    - echo "$REG_PWD" | docker login $REG_HOST -u "$REG_USERNAME" --password-stdin
  script:
    - echo "Building Docker images..."
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker build -t $IMAGE_NAME:latest .
    - echo "Pushing images to registry..."
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
    - echo "Build and push completed successfully"
    - echo "IMAGE_URL=$IMAGE_NAME:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_TAG

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh $DEPLOY_USER@$DEPLOY_HOST <<EOF
        docker login -u "$REG_USERNAME" -p "$REG_PWD" "$REG_HOST"
        cd /home/vbl-devop/release-ci-cd
        echo "$IMAGE_TAG"
        export IMAGE_TAG=$IMAGE_TAG
        docker compose pull
        docker compose up -d
      EOF
  rules:
    - if: $CI_COMMIT_TAG