deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh python3 py3-pip
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | sed 's/\r$//' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keygen -l -f ~/.ssh/id_ed25519 || echo "INVALID SSH KEY"
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

    - echo "$GITLAB_SSH_KEY" | tr -d '\r' > $HOME/.ssh/id_rsa
    - chmod 600 $HOME/.ssh/id_rsa
    - echo "StrictHostKeyChecking no" >> $HOME/.ssh/config

    # Clone the repo containing deploy_uat.yml
    - apk add --no-cache git  # Install git if not available
    - git clone "https://${GITLAB_USER}:${GITLAB_PASSWORD}@gitscm.vattanacbrewery.com/devops/release-ci-cd.git" releasedeploy
    - cd releasedeploy

    - python3 -m venv venv
    - . venv/bin/activate
    - pip install --upgrade pip
    - pip install ansible
    - ansible-galaxy collection install community.docker
    - apk add --no-cache curl
  script:
    - ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i ansible/inventory.ini ansible/deploy.yml -e "CI_REGISTRY=$REG_HOST" -e "CI_REGISTRY_USER=$REG_USERNAME" -e "CI_REGISTRY_PASSWORD=$REG_PWD" -e "IMAGE_TAG=$IMAGE_TAG" --ask-pass --ask-become-pass
  rules:
    - if: $CI_COMMIT_TAG